services:
  excalidash-backend:
    image: zimengxiong/excalidash-backend:latest
    restart: unless-stopped
    environment:
      - DATABASE_URL=file:/app/prisma/dev.db
      - PORT=8000
      - NODE_ENV=production
      - AUTH_MODE=${AUTH_MODE:-local}
      - FRONTEND_URL=https://excalidash.${DOMAIN}
      - TRUST_PROXY=1
      - JWT_SECRET=${JWT_SECRET}
      - CSRF_SECRET=${CSRF_SECRET}
      # Optional: disable outbound GitHub release checks.
      # - UPDATE_CHECK_OUTBOUND=false
      # Optional OIDC settings (required for AUTH_MODE=hybrid or oidc_enforced)
      # - OIDC_PROVIDER_NAME=Authentik
      # - OIDC_ISSUER_URL=https://auth.example.com/application/o/excalidash/
      # - OIDC_CLIENT_ID=your-client-id
      # - OIDC_CLIENT_SECRET=your-client-secret
      # - OIDC_REDIRECT_URI=https://excalidash.${DOMAIN}/api/auth/oidc/callback
    volumes:
      - backend-data:/app/prisma
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:8000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  excalidash-frontend:
    image: zimengxiong/excalidash-frontend:latest
    restart: unless-stopped
    ports:
      - "6767:80"
    environment:
      - BACKEND_URL=excalidash-backend:8000
    depends_on:
      - excalidash-backend
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:80",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.excalidash.rule=Host(`excalidash.${DOMAIN}`)"
      - "traefik.http.routers.excalidash.entrypoints=websecure"
      - "traefik.http.services.excalidash.loadbalancer.server.port=80"
      - "traefik.http.routers.excalidash.service=excalidash"
      - "traefik.http.routers.excalidash.tls.certresolver=dnsresolver"

volumes:
  backend-data:

networks:
  default:
    external: true
    name: traefiknet
